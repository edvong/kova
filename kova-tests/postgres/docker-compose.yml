services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: kova-pg-test
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kova_test
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./certs:/certs
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache openssl >/dev/null 2>&1
        mkdir -p /certs /tmp/pg-ssl
        if [ ! -f /certs/ca.crt ] || [ ! -f /certs/server.crt ]; then
          openssl req -new -x509 -days 3650 -nodes -out /certs/ca.crt -keyout /certs/ca.key -subj "/CN=kova-test-ca"
          openssl req -new -nodes -out /tmp/pg-ssl/server.csr -keyout /certs/server.key -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n" > /tmp/pg-ssl/ext.cnf
          openssl x509 -req -in /tmp/pg-ssl/server.csr -days 47 -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial -out /certs/server.crt -extfile /tmp/pg-ssl/ext.cnf
          chmod 644 /certs/ca.crt /certs/server.crt
        fi
        cp /certs/server.crt /tmp/pg-ssl/server.crt
        cp /certs/server.key /tmp/pg-ssl/server.key
        chown postgres:postgres /tmp/pg-ssl/server.crt /tmp/pg-ssl/server.key
        chmod 600 /tmp/pg-ssl/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/tmp/pg-ssl/server.crt \
          -c ssl_key_file=/tmp/pg-ssl/server.key \
          -c max_connections=200