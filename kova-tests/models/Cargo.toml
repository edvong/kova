[package]
name = "models"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kova = { path = "../../kova", default-features = false}

uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
time = "0.3"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[features]
postgres = ["kova/postgres"]
sqlite = ["kova/sqlite"]