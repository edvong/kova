[package]
name = "sqlite"
version = "0.1.0"
edition = "2024"
publish = false


[dependencies]
kova = { path = "../../kova", default-features = false, features = ["sqlite"] }
models = { path = "../models", features = ["sqlite"] }

uuid = { version = "1.24.0", features = ["v4"] }
chrono = "0.4.45"
jiff = "0.2.35"
url = "2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1.0.122"