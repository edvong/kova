[package]
name = "kova"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
readme = "../README.md"
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
kova-core = { workspace = true }
kova-derive = { workspace = true }
kova-pg = { workspace = true, optional = true }
kova-sqlite = { workspace = true, optional = true }

[features]
default = ["pg"]

# PostgreSQL-specific features
pg = ["dep:kova-pg"]
pg-pool = []
pg-rustls = []
pg-native-tls = []

# SQLite-specific features
sqlite = ["dep:kova-sqlite"]
sqlite-pool = []

json = []

