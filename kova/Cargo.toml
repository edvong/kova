[package]
name = "kova"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
readme = "../README.md"
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
kova-core = { workspace = true }
kova-derive = { workspace = true }
kova-postgres = { workspace = true, optional = true }
kova-sqlite = { workspace = true, optional = true }

[features]
default = ["postgres"]
narrow-cast = ["kova-postgres?/narrow-cast", "kova-sqlite?/narrow-cast"]

# PostgreSQL-specific features
postgres = ["dep:kova-postgres"]
rustls = ["kova-postgres?/rustls"]
native-tls = ["kova-postgres?/native-tls"]

# SQLite-specific features
sqlite = ["dep:kova-sqlite"]
