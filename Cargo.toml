[workspace]
members = [
    "kova-core",
    "kova-pg",
    "kova-sqlite",
    "kova-derive",
    "kova",
]
exclude = ["kova-tests"]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Edmond Vong <edmond@edvong.com>"]
description = "A PostgreSQL and SQLite ORM for Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edvong/kova"
keywords = ["postgres", "sqlite", "orm", "database", "sql"]

[workspace.dependencies]
kova-core = { path = "kova-core" }
kova-derive = { path = "kova-derive" }
kova-pg = { path = "kova-pg" }
kova-sqlite = { path = "kova-sqlite" }

thiserror = "2"

tokio-postgres = "0.7"
deadpool-postgres = "0.14"

rustls = "0.23"
tokio-postgres-rustls = "0.14"

native-tls = "0.2.18"
postgres-native-tls = "0.5"

rusqlite = "0.40"
r2d2 = "0.8"
r2d2_sqlite = "0.35"

proc-macro2 = "1"
syn = { version = "3.0.9", features = ["full", "extra-traits"] }
quote = "1"
heck = "0.5"
