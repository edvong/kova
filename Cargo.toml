[workspace]
members = [
    "kova-kernel",
    "kova-derive",
    "kova-postgres",
    "kova-sqlite",
    "kova",
]
exclude = ["kova-tests"]

resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Edmond Vong <edmond@edvong.com>"]
description = "A macro-free, modern PostgreSQL and SQLite ORM for Rust with native binary JSONB and FTS5"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edvong/kova"
keywords = ["postgresql", "sqlite", "orm", "sql", "database"]
categories = ["database", "asynchronous"]

[workspace.dependencies]
kova-kernel = { path = "kova-kernel", version = "0.1.1" }
kova-derive = { path = "kova-derive", version = "0.1.1" }
kova-postgres = { path = "kova-postgres", version = "0.1.1" }
kova-sqlite = { path = "kova-sqlite", version = "0.1.1" }

tokio-postgres = "0.7"
deadpool-postgres = "0.14"

rustls = "0.23"
tokio-postgres-rustls = "0.14"

native-tls = "0.2.18"
postgres-native-tls = "0.5"

rusqlite = "0.41.1"

proc-macro2 = "1"
syn = "3.0"
quote = "1"
heck = "0.5"
